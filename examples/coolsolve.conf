# CoolSolve solver configuration
# Place this file in the same folder as your .eescode file (not in subfolders)
# to override default solver settings. Only the options you set here are applied;
# others keep the built-in defaults. Lines starting with # are ignored.

# --- Main iteration ---
# Maximum Newton iterations per block (default: 100)
maxIterations = 100

# Convergence: stop when max residual is below this (default: 1e-9)
# tolerance = 1e-9

# Relative convergence: stop when ||F||/||F0|| below this (default: 1e-9)
# relativeTolerance = 1e-9

# Minimum step size; smaller steps are treated as converged (default: 1e-12)
# stepTolerance = 1e-12

# Print iteration info to stderr (default: false)
# verbose = false

# --- Line search (Newton) ---
# Armijo condition parameter (default: 1e-4)
# lsAlpha = 1e-4

# Step reduction factor in backtracking (default: 0.5)
# lsRho = 0.5

# Max line search iterations per Newton step (default: 100)
# lsMaxIterations = 100

# Minimum step size in line search (default: 1e-10)
# lsMinStep = 1e-10

# If line search fails, accept as converged when ||F|| below this (default: 1e-2)
# lsRelaxedTolerance = 1e-2

# Non-monotone line search memory M (Grippo, Lampariello, Lucidi 1986).
# Instead of requiring strict decrease at every step (monotone Armijo),
# compare against the maximum merit value over the last M iterations.
# This helps escape narrow valleys and saddle points that trap monotone methods.
# The reference is bounded at max 10× the current merit to prevent
# catastrophic acceptance of bad steps from stale history.
#   M = 1  →  standard monotone Armijo (classic behavior)
#   M = 10 →  non-monotone (default, recommended for most models)
# Applied to Newton (Armijo condition), TrustRegion, and LM (step acceptance).
# Increase M if the solver oscillates near a curved valley;
# decrease toward 1 if you observe the solver accepting steps that increase
# the residual too aggressively.
lsNonMonotoneMemory = 10

# --- Variable scaling ---
# Enable automatic variable scaling for better conditioning (default: true)
# enableScaling = true

# --- Broyden quasi-Newton (Newton solver enhancement) ---
# When > 0, the Newton solver performs a full Jacobian evaluation every K
# iterations and uses Sherman-Morrison (Broyden rank-1) updates in between.
# This reduces the number of expensive Jacobian evaluations by a factor of K.
# If the Broyden approximation fails line search, a full Jacobian is
# recomputed automatically.
#   0 = disabled (full Jacobian every iteration, classic Newton; default)
#   5 = recompute every 5 iterations (good starting point)
# broydenRecomputeInterval = 0

# --- Trust region solver options ---
# Initial trust region radius (default: 10.0)
# trInitialRadius = 10.0

# Maximum trust region radius (default: 1000.0)
# trMaxRadius = 1000.0

# Step acceptance threshold (default: 0.05)
# trEta = 0.05

# Shrink factor when step is rejected (default: 0.5)
# trShrinkFactor = 0.5

# Grow factor when step is accepted (default: 2.0)
# trGrowFactor = 2.0

# Adaptive initial radius: set the initial trust radius from the Cauchy
# step norm on the first iteration, instead of using a fixed trInitialRadius.
# This scales the trust region to the problem geometry automatically.
# Also enables smoother rho-based radius adaptation. (default: true)
# trAdaptiveRadius = true

# hybrd-style Broyden quasi-Newton reuse for TrustRegion (Powell 1970).
# When > 0, TrustRegion computes a full Jacobian every K iterations and
# maintains a Broyden rank-1 approximation (via an incrementally-updated
# QR factorization) in between, saving expensive Jacobian evaluations.
# A full Jacobian is also recomputed immediately after trBroydenRestartRejects
# consecutive rejected steps (Powell's restart criterion), or if the
# resulting step is non-finite.
#   0 = disabled (full Jacobian every iteration, classic behavior; default)
#   5 = recompute every 5 iterations (good starting point)
# trBroydenRecomputeInterval = 0

# Number of consecutive rejected steps that triggers the Powell restart
# (forces a full Jacobian recompute). Only relevant when
# trBroydenRecomputeInterval > 0. (default: 2)
# trBroydenRestartRejects = 2

# --- Levenberg-Marquardt solver ---
# Initial damping parameter (default: 1e-3)
# lmInitialLambda = 1e-3

# Factor to increase lambda on bad step (default: 10.0)
# lmLambdaIncrease = 10.0

# Factor to decrease lambda on good step (default: 0.1)
# lmLambdaDecrease = 0.1

# Minimum damping parameter (default: 1e-12)
# lmMinLambda = 1e-12

# Maximum damping parameter (default: 1e8)
# lmMaxLambda = 1e8

# Nielsen's smooth lambda adaptation (Madsen et al. 2004).
# Uses λ = λ * max(1/3, 1 - (2ρ-1)³) on acceptance and λ = λ * ν with ν
# doubling on consecutive rejections.  Provides smoother, faster-converging
# lambda transitions than the legacy step-wise increase/decrease. (default: true)
# lmNielsenUpdate = true

# Geodesic acceleration (Transtrum & Sethna 2012).
# Adds a second-order correction to the LM step by evaluating the directional
# second derivative of F along the velocity step.  Costs 1 extra residual
# evaluation per iteration but can halve iterations on curved problems.
# Automatically disabled when the acceleration term dominates the velocity.
# (default: true)
# lmGeodesicAcceleration = true

# --- Partitioned block solver (fallback for hard algebraic loops) ---
# Max iterations for partitioned solver (default: 300)
# partitionedMaxIterations = 300

# Relaxation factor for updates, 0 < w <= 1 (default: 0.6)
# partitionedRelaxation = 0.6

# Minimum |dF_i/dx_i| to update variable (default: 1e-12)
# partitionedMinDiagonal = 1e-12

# Only use partitioned solver for blocks of this size or larger (default: 4)
# partitionedMinBlockSize = 4

# --- Tearing (structural decomposition of algebraic loops) ---
#
# When enableTearing = true AND the block size >= tearingMinBlockSize, CoolSolve
# first attempts to solve the block via structural tearing BEFORE the standard
# solver pipeline. Tearing is applied independently of which solvers are listed
# in solverPipeline: it runs as a pre-pass whenever it is enabled, and the
# pipeline solvers are only tried if tearing fails.
#
# Tearing selects a minimal "tear set" (feedback vertex set) using a greedy
# algorithm so that removing the torn variables makes the remaining system
# acyclic. The acyclic part is solved sequentially (one equation → one unknown
# per step), and Newton is applied only to the small tear-variable residual.
# This can dramatically reduce the effective system size for stiff or densely
# coupled algebraic loops.
#
# When to enable tearing:
#   - Large, densely-coupled algebraic loops (e.g. heat exchangers, ORC cycles)
#     where Newton fails due to poor conditioning or slow convergence.
#   - When all standard solvers hit max iterations but the model is known to
#     have a solution (e.g. the model converges in EES with the same initials).
#
# When NOT to use tearing:
#   - Small blocks (< tearingMinBlockSize): overhead not worthwhile.
#   - Models with strong mutual dependencies on all variables (tearing may
#     choose a poor tear set and cycle).
#   - For quick tests: tearing adds setup cost even when it succeeds quickly.
#
# Interaction with the solver pipeline:
#   - If tearing succeeds, the pipeline solvers are NOT called for that block.
#   - If tearing fails, the initial guess is restored and the pipeline solvers
#     (Newton, TrustRegion, etc.) are tried normally.
#   - enableTearing = false (default): the pipeline solvers are always used.
#
enableTearing = true
# tearingMaxIterations = 100   # Max Newton iterations on the tear-variable residual
# tearingMinBlockSize = 3      # Minimum block size for tearing (default: 3)
# tearingInnerIterations = 5   # Max 1D iterations per equation in the acyclic solve

# --- Symbolic Block Reduction ---
#
# When enableSymbolicReduction = true, blocks of size ≥ 2 are pre-processed
# BEFORE tearing and the solver pipeline to reduce their size.  Three
# techniques are applied iteratively:
#
#   1. Explicit extraction: equations where the output variable can be computed
#      directly from known values are extracted and evaluated before solving.
#
#   2. CoolProp call inversion: thermodynamic equations like
#          h = enthalpy(Water, T=T, P=P)
#      are reformulated so that an unknown input becomes the output, e.g.
#          T = temperature(Water, H=h, P=P)
#      when h and P are known but T is not.  Supported CoolProp input pairs
#      (PT, HP, PS, HS, DP, DT, QT, PQ, etc.) are checked automatically.
#
#   3. Equation substitution: if a variable appears in only its own defining
#      equation (not referenced by other block equations), it is extracted as
#      a post-solve step.
#
# The result is a (possibly much smaller) block for the iterative solver.
# For example, a 3-variable CoolProp block can often be reduced to three
# size-1 explicit evaluations, eliminating Newton iterations entirely.
#
# When to enable:
#   - Models with many CoolProp calls that form algebraic loops (refrigeration
#     cycles, ORC, heat exchangers).
#   - Large blocks where Newton/LM/TR struggle due to poor conditioning.
#
# When disabled (default), zero overhead is added to the solving pipeline.
#
enableSymbolicReduction = true

# --- Solver pipeline ---
#
# The pipeline defines which solvers are tried and in what order.
# Available solvers: Newton, TrustRegion, LM (or LevenbergMarquardt),
#                    BisectionND, Homotopy, Partitioned
#
# Solver characteristics:
#   Newton             – Fast quadratic convergence near a good starting point.
#   TrustRegion        – Robust for bounded regions; good with log/exp constraints.
#   LevenbergMarquardt – Near-singular Jacobians; blends gradient descent and Newton.
#   BisectionND        – Derivative-free; works even when J=0. Skipped for n > bisectionNDMaxBlockSize.
#   Homotopy           – Distant starting points; deforms problem from easy to hard.
#   Partitioned        – Last resort; per-variable diagonal update for ill-conditioned loops.
#
# Named presets (for reference — the GUI exposes these as dropdown items):
#   Sequential (default) – all solvers, sequential
#   Parallel             – all solvers, parallel
#   Newton only          – solverPipeline = Newton
#   TrustRegion only     – solverPipeline = TrustRegion
#   LevenbergMarquardt   – solverPipeline = LevenbergMarquardt
#   BisectionND only     – solverPipeline = BisectionND
#   Homotopy only        – solverPipeline = Homotopy
#   Partitioned only     – solverPipeline = Partitioned
#
# Default: Newton
# solverPipeline = Newton

# Execution mode:
#   sequential  – Try solvers one after another; each warm-starts from the best solution
#                 found so far. Pipeline restarts from the best point if residual improves.
#                 Best for most models. This is the default.
#   parallel    – Launch all solvers concurrently; first to converge wins.
#                 Can save time when the best solver is unclear. Uses more CPU.
# Default: sequential
# pipelineMode = sequential

# --- BisectionND options ---
#
# BisectionND is a derivative-free bisection solver based on sign-change detection.
# It works by probing 2^n combinations around the initial guess to find vertices
# with differing sign patterns, then bisecting edges toward the root.
# Cost is EXPONENTIAL in n, so it is only practical for small blocks.
#
# Maximum block size for BisectionND (default: 8).
# Blocks larger than this are silently skipped (the next pipeline solver is tried).
# Increasing this value allows BisectionND to attempt larger blocks, but be aware
# of the exponential cost: n=10 probes 1024 corners, n=12 probes 4096, etc.
# bisectionNDMaxBlockSize = 8

# Iteration multiplier for BisectionND (default: 1.0).
# BisectionND converges linearly (much slower than Newton), so it typically
# needs more iterations to reach a tight tolerance.
# The actual iteration budget is: round(maxIterations * bisectionNDIterFactor).
# Example: maxIterations=100, bisectionNDIterFactor=5 → 500 bisection steps.
# Increase this if BisectionND reports "max iterations reached" on problems where
# you know a root exists.
# bisectionNDIterFactor = 1.0

# --- KINSOL (SUNDIALS-style solver) ---
#
# KINSOL is a SUNDIALS-KINSOL-style nonlinear solver, available as the strategy
# "Kinsol" in solverPipeline.  It is OFF by default (not in the default
# pipeline); add it explicitly, e.g.:
#   solverPipeline = Newton, TrustRegion, LM, BisectionND, Homotopy, Partitioned, Kinsol
#
# It supports three globalisation strategies, selected by kinsolGlobalStrategy:
#
#   linesearch (default)
#       Inexact Newton (exact direct linear solve) + Dennis-Schnabel line
#       search: backtracking with quadratic then cubic interpolation and the
#       Armijo sufficient-decrease test on 0.5||F||².  Uses the Jacobian.  More
#       sophisticated than the geometric backtracking used by the Newton solver.
#
#   picard
#       Fixed-point (Richardson) iteration x ← x − ω·F(x).  No Jacobian.
#       Converges when ρ(I − ω·J) < 1, so under-relax (kinsolPicardOmega < 1)
#       for stiff systems.  A good fit for diagonally-dominant blocks.
#
#   fp
#       Anderson-accelerated fixed point (Anderson 1965; Walker & Ni 2011).
#       Derivative-free; can converge for blocks where the Jacobian is zero or
#       singular (complementary to BisectionND).
#
# kinsolGlobalStrategy = linesearch

# Sufficient-decrease coefficient α for the KINSOL line search (Armijo).
# Range (0,1).  Smaller → stricter decrease. (default: 1e-4)
# kinsolLineSearchAlpha = 1e-4

# Max backtracking trials per Newton step in the KINSOL line search. (default: 30)
# kinsolLineSearchMaxIters = 30

# Relaxation ω for Picard / Anderson: x ← x − ω·F(x).  Must be > 0.
# Use ω < 1 to under-relax stiff (near-divergent) fixed-point iterations.
# (default: 1.0)
# kinsolPicardOmega = 1.0

# History depth m for Anderson acceleration (kinsolGlobalStrategy = fp).
# m = 0 disables acceleration (degenerates to plain fixed point). (default: 5)
# kinsolAndersonDepth = 5

# Damping θ for Anderson acceleration: x_next = x + θ·(x_Anderson − x).
# θ = 1 → pure Anderson (default); θ < 1 → more conservative.  Range (0,1].
# (default: 1.0)
# kinsolAndersonRelaxation = 1.0

# --- Multi-start fallback (roadmap §4.2) ---
#
# When a multi-variable block fails the entire solver pipeline, CoolSolve
# retries it from a few alternative starting points.  This rescues models
# whose default initial guess (computed at T=20C, P=1 atm by CoolProp, or 1.0
# for non-thermo variables) lies in the wrong convergence basin — the
# dominant failure mode when no .initials file is provided.
#
# Two complementary candidate strategies are used, picked automatically:
#   * Thermo blocks (containing enthalpy/pressure/... calls): each thermo
#     variable is re-evaluated via CoolProp at a coherent reference (T, P)
#     state, so the candidate is internally consistent (e.g. h matches
#     enthalpy(fluid, T, P)).  Pressure regimes cover low/medium/high cycles.
#   * Purely-algebraic blocks (no thermo variables): the default guess is
#     scaled by a set of factors {0.1, 0.3, 3, 10} to escape wrong-magnitude
#     starts (e.g. a clearance C ~ 0.05 guessed as 1.0).
#
# Zero overhead when every block converges on the first try: the candidate
# search only triggers AFTER a block failure.  Size-1 blocks are skipped
# (Newton1D already does its own multi-probe).
#
# Enable the multi-start fallback (default: true).
# multiStartEnabled = true
#
# Number of alternative starting points to try on a failed block (default: 4).
# Each candidate replays the full solver pipeline, so large values increase the
# worst-case cost of a failure.  Range 1..6.
# multiStartMaxRestarts = 4

# Number of threads used to evaluate multi-start candidates concurrently
# (default: 1 = sequential, bit-for-bit identical to the original behaviour).
#   1  = sequential (no threading overhead)
#   N>1= run up to N candidates concurrently (first-to-converge wins)
#   0  = auto: min(hardware_concurrency, number of candidates)
# Only consulted when multi-start engages (i.e. a block actually fails), so it
# adds zero overhead to successful solves.  Parallel candidates reuse the
# thread-safe solveBlockSequential core; tearing and symbolic reduction, when
# enabled, are applied only in the initial single-threaded attempt.
# multiStartNumCores = 1

# --- Safety ---
# Timeout in seconds; 0 = no timeout (default: 0)
# timeoutSeconds = 0

# =============================================================================
# CoolProp Integration
# =============================================================================
# These options control how CoolSolve calls the CoolProp thermodynamic library.
# The defaults are optimised for the best balance of speed and robustness.

# Backend for AbstractState factory (default: HEOS)
# Options: HEOS (full Helmholtz), TTSE&HEOS (tabular), BICUBIC&HEOS (tabular)
# Tabular backends build an interpolation table on first use, which may take
# several seconds but subsequent evaluations are much faster.
# coolpropBackend = HEOS

# Use the low-level AbstractState API instead of the high-level PropsSI function.
# Eliminates string parsing and fluid-lookup overhead on every call.
# When false, the legacy PropsSI path is used with zero overhead. (default: true)
# coolpropUseAbstractState = true

# Analytical derivatives via CoolProp's first_partial_deriv() instead of
# central finite differences (4 extra calls per property evaluation).
# Requires coolpropUseAbstractState = true. (default: true)
# coolpropEnableAnalyticalDerivatives = true

# Cache AbstractState instances across evaluations (thread-local).
# Avoids re-creating the state object for every CoolProp call. (default: true)
# coolpropCacheEnabled = true

# Enable CoolProp superancillary functions for faster VLE initialisation.
# Adds a small startup cost but accelerates two-phase lookups. (default: true)
# coolpropEnableSuperancillaries = true

# =============================================================================
# LaTeX Report
# =============================================================================
# When enabled, CoolSolve generates a LaTeX (.tex) report after a successful
# solve.  The report contains model equations, variable solutions, block
# structure, solver performance details, and timing information.  Plots
# (thermodynamic diagrams, parametric studies) are included via \IfFileExists
# so the document compiles with or without them.
#
# The backend only produces the LaTeX source; compilation to PDF is handled
# by the GUI or by the user's local TeX installation.

# Generate a LaTeX report after every successful solve (default: false)
# enableLatexReport = false

# LaTeX compiler command used by the GUI for PDF compilation (default: pdflatex)
# Common alternatives: xelatex, lualatex
# latexCompiler = pdflatex

# =============================================================================
# Equation-based Integration (INTEGRAL / $IntegralTable)
# =============================================================================
# Options for the dynamic (ODE/DAE) solver, used only when the model contains
# an INTEGRAL() call.  Inert by default: a model without INTEGRAL() never
# reaches this code path (zero overhead).
#
# See docs/integral_table_plan.md for the full description and the list of
# available methods.

# Integration method: one of EulerExplicit, EulerImplicit, RK4, RK45.
# RK4 (fixed step, 4th order) is the recommended default.  Use RK45 for
# adaptive (variable) step control via integralRelTol/integralAbsTol.
# integralMethod = RK4

# Fixed step size.  0 => derive from integralMaxSteps as (tf-t0)/integralMaxSteps.
# integralFixedStep = 0.0

# Upper bound on the number of integration steps (default: 1000).
# integralMaxSteps = 1000

# RK45 relative / absolute local error control (default: 1e-6 / 1e-9).
# integralRelTol = 1e-6
# integralAbsTol = 1e-9

# RK45 min/max step bounds; 0 = auto (default).
# integralMinStep = 0.0
# integralMaxStep = 0.0

# Richardson extrapolation: cancels the leading truncation error term, raising
# the effective order by one (fixed-step methods only).  Triples the cost per
# step.  Default: false.
# integralRichardson = false

# Default output spacing for the IntegralTable when $IntegralTable omits the
# ':interval'.  0 = record every step (default).
# integralOutputInterval = 0.0
